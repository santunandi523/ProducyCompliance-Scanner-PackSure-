server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/packsure?clientEncoding=UTF8
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=60MB

# PackSure Application Properties
packsure.ai.service.url=http://127.0.0.1:8000
packsure.storage.path=d:/ProductCompliance/product-compliance-scanner/storage
packsure.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
packsure.jwt.expiration-ms=86400000

# CORS
packsure.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson JSON Serialization
spring.jackson.serialization.fail-on-empty-beans=false

