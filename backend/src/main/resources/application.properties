server.port=${PORT:8081}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/packsure?clientEncoding=UTF8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=60MB

# PackSure Application Properties
packsure.ai.service.url=${PACKSURE_AI_SERVICE_URL:http://127.0.0.1:8000}
packsure.storage.path=${PACKSURE_STORAGE_PATH:d:/ProductCompliance/product-compliance-scanner/storage}
packsure.jwt.secret=${PACKSURE_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
packsure.jwt.expiration-ms=86400000

# CORS (Supports localhost, local IP, and any Vercel deployment domain)
packsure.cors.allowed-origins=${PACKSURE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson JSON Serialization
spring.jackson.serialization.fail-on-empty-beans=false

